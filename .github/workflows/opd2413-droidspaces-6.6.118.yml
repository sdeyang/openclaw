name: Build OPD2413 DroidSpaces 6.6.118

on:
  push:
    branches:
      - kernel-opd2413-ds-6.6.118
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout control repo
        uses: actions/checkout@v4

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex git libelf-dev libssl-dev \
            python3 rsync unzip zip dwarves ca-certificates xz-utils
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o /tmp/repo
          chmod +x /tmp/repo
          sudo mv /tmp/repo /usr/local/bin/repo

      - name: Sync exact OnePlus Pad 2 Pro Android 16 source
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/kernel"
          cd "$GITHUB_WORKSPACE/kernel"
          repo init --depth=1 \
            -u https://github.com/OnePlusOSS/kernel_manifest.git \
            -b oneplus/sm8750 \
            -m oneplus_pad_2_pro_b.xml
          repo sync -c --no-tags --no-clone-bundle -j"$(nproc)"
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) = ' kernel_platform/common/Makefile
          test "$(awk '/^VERSION =/{print $3}' kernel_platform/common/Makefile)" = "6"
          test "$(awk '/^PATCHLEVEL =/{print $3}' kernel_platform/common/Makefile)" = "6"
          test "$(awk '/^SUBLEVEL =/{print $3}' kernel_platform/common/Makefile)" = "118"

      - name: Apply upstream DroidSpaces GKI module
        run: |
          set -euxo pipefail
          git clone --depth=1 https://github.com/xingguangcuican6666/DroidSpaces-OSS-module.git "$GITHUB_WORKSPACE/ds-module"
          export KERNEL_ROOT="$GITHUB_WORKSPACE/kernel/kernel_platform"
          export DEFCONFIG="$GITHUB_WORKSPACE/kernel/kernel_platform/common/arch/arm64/configs/gki_defconfig"
          export RUNNER_TEMP="${RUNNER_TEMP:-/tmp}"
          bash "$GITHUB_WORKSPACE/ds-module/setup.sh"
          grep -E 'CONFIG_(SYSVIPC|POSIX_MQUEUE|IPC_NS|PID_NS|DEVTMPFS|NETFILTER_XT_MATCH_ADDRTYPE)=' "$DEFCONFIG"

      - name: Build kernel Image
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 4G
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/kernel/kernel_platform/common"
          TOOLCHAIN="$GITHUB_WORKSPACE/kernel/kernel_platform/prebuilts/clang/host/linux-x86"
          CLANG_BIN="$(find "$TOOLCHAIN" -maxdepth 2 -type f -name clang -path '*/bin/clang' | head -n1)"
          test -x "$CLANG_BIN"
          export PATH="$(dirname "$CLANG_BIN"):$PATH"
          clang --version
          ccache -M 4G || true
          rm -rf out
          make -j"$(nproc)" O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CC="ccache clang" HOSTCC="ccache clang" gki_defconfig
          make -j"$(nproc)" O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CC="ccache clang" HOSTCC="ccache clang" Image
          test -s out/arch/arm64/boot/Image
          file out/arch/arm64/boot/Image
          sha256sum out/arch/arm64/boot/Image

      - name: Verify DroidSpaces configuration
        run: |
          set -euxo pipefail
          CONFIG="$GITHUB_WORKSPACE/kernel/kernel_platform/common/out/.config"
          for opt in \
            CONFIG_NAMESPACES CONFIG_PID_NS CONFIG_IPC_NS CONFIG_UTS_NS \
            CONFIG_NET_NS CONFIG_SYSVIPC CONFIG_POSIX_MQUEUE CONFIG_DEVTMPFS; do
            grep -q "^${opt}=y$" "$CONFIG" || { echo "MISSING: ${opt}=y"; exit 1; }
          done
          grep -E '^CONFIG_(NAMESPACES|PID_NS|IPC_NS|UTS_NS|NET_NS|SYSVIPC|POSIX_MQUEUE|DEVTMPFS)=y$' "$CONFIG"

      - name: Prepare artifacts
        run: |
          set -euxo pipefail
          OUT="$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$OUT"
          cp "$GITHUB_WORKSPACE/kernel/kernel_platform/common/out/arch/arm64/boot/Image" "$OUT/Image-OPD2413-6.6.118-DroidSpaces"
          cp "$GITHUB_WORKSPACE/kernel/kernel_platform/common/out/.config" "$OUT/kernel-config"
          cat > "$OUT/BUILD-INFO.txt" <<'EOF'
          Device: OnePlus Pad 2 Pro (OPD2413)
          Firmware target: OPD2413_16.0.9.400(CN01)
          Source manifest: OnePlusOSS/kernel_manifest @ oneplus/sm8750, oneplus_pad_2_pro_b.xml
          Kernel source branch: oneplus/sm8750_b_16.0.0_pad_2_pro
          Expected kernel base: 6.6.118
          DroidSpaces integration: upstream ABK module + required GKI kABI-safe patch/config
          Root: no KernelSU added; this artifact is a raw kernel Image only
          Safety: DO NOT flash the raw Image directly to a partition. Repack it into your exact stock boot image or a verified device-specific AnyKernel package first.
          EOF
          cd "$OUT"
          sha256sum Image-OPD2413-6.6.118-DroidSpaces kernel-config > SHA256SUMS.txt

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OPD2413-6.6.118-DroidSpaces
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
